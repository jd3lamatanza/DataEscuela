<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · DataEscuela</title>
  <link rel="stylesheet" href="styles.css">
  <style>.dashboard{min-height:100vh;padding:32px;background:#f3f8f6}.dashboard-bar{display:flex;justify-content:space-between;align-items:center;max-width:1050px;margin:0 auto;padding-bottom:28px;border-bottom:1px solid #dce7e9}.dashboard-card{max-width:1050px;margin:55px auto;padding:42px;background:#fff;border:1px solid #dce7e9;border-radius:16px;box-shadow:0 18px 45px rgba(24,49,59,.08)}.dashboard-card h1{margin:10px 0;font-size:clamp(2rem,5vw,4rem);font-weight:500;letter-spacing:-.05em}.dashboard-card p{color:#68808a;font:1rem/1.6 Arial,sans-serif}.logout{width:auto;border:1px solid #dce7e9;color:#17343d;background:#fff}.logout:hover{color:#fff;background:#087f86}</style>
</head>
<body><main class="dashboard"><header class="dashboard-bar"><div class="brand"><span class="brand-mark">D</span><span><strong>DataEscuela</strong><small>Jefatura Distrital 3</small></span></div><button id="logout" class="primary-button logout" type="button">Cerrar sesión</button></header><section class="dashboard-card"><span class="eyebrow">Acceso confirmado</span><h1 id="welcome">Panel DataEscuela</h1><p id="profileText">Cargando perfil...</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="dashboard.js"></script></body></html>
